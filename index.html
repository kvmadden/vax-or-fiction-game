    <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Audio beds are warmed by AudioPlayer EARLY_PREFETCH via HTMLAudioElement.load().
         as=fetch here duplicated Smile's 1.4MB without satisfying the media cache. -->
    <meta name="description" content="An interactive vaccine knowledge game. Join on your phone, make your call, and explore the evidence together." />
